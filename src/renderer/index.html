<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>音乐播放器</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="./styles/style.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#1DB954',
            secondary: '#191414',
            dark: '#121212',
            light: '#F8F8F8',
            sidebar: '#181818',
            hover: '#282828',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      }
    }
  </script>
</head>

<body class="min-h-screen bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-white">

  <!-- 主界面 -->
  <div id="mainInterface" class="flex h-screen overflow-hidden">

    <!-- 主内容区 -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- 顶部搜索栏 -->
      <div class="p-4 border-b border-gray-700 flex items-center gap-3 dark:border-gray-700">
        <div class="relative flex-1">
          <input type="text" id="searchInput"
            class="w-full bg-gray-100 border border-gray-300 rounded-full py-2 px-4 pl-9 focus:outline-none focus:ring-2 focus:ring-primary/50 text-gray-800 dark:bg-gray-800 dark:border-gray-600 dark:text-white"
            placeholder="搜索音乐">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 absolute left-3 top-2.5 text-gray-400" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <!-- 搜索历史记录 -->
          <div id="searchHistoryContainer"
            class="absolute top-full left-0 right-0 bg-white border border-gray-300 rounded-lg shadow-lg mt-1 z-40 hidden dark:bg-gray-800 dark:border-gray-700">
            <div class="max-h-[200px] overflow-y-auto">
              <ul id="searchHistoryList" class="divide-y divide-gray-200 dark:divide-gray-700">
                <!-- 搜索历史动态渲染 -->
              </ul>
            </div>
          </div>
          <button id="clearSearchBtn"
            class="absolute right-3 top-2.5 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hidden"
            aria-label="清空搜索">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
        <button id="theme-toggle"
          class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-300 hover:bg-gray-400 text-gray-800 transition-all duration-200 dark:bg-gray-700 dark:text-white dark:hover:bg-gray-600">
          <!-- 深色模式图标：月亮 -->
          <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
          <!-- 浅色模式图标：太阳 -->
          <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        </button>
        <button id="searchBtn"
          class="bg-primary hover:bg-primary/90 text-white font-medium py-2 px-4 rounded-full transition-all duration-200">
          搜索
        </button>
      </div>

      <!-- 内容区域 -->
      <div class="flex-1 flex flex-col p-6 pb-20 overflow-hidden min-h-0">
        <!-- 搜索结果 -->
        <div id="searchResultsSection" class="flex-1 flex flex-col mb-8 hidden min-h-0">
          <div class="flex items-center justify-between mb-4 flex-shrink-0">
            <h2 class="text-xl font-bold dark:text-white">搜索结果</h2>
            <!-- 自定义歌单操作按钮，默认隐藏 -->
            <div class="flex gap-2">
              <!-- 新建/导入歌单按钮 -->
              <button id="createPlaylistBtn"
                class="px-3 py-1 bg-primary hover:bg-primary/90 text-white rounded-lg transition-colors duration-200 text-sm hidden flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                </svg>
              </button>
              <!-- 导入导出用户信息按钮 -->
              <button id="importUserInfoBtn"
                class="px-3 py-1 bg-primary hover:bg-primary/90 text-white rounded-lg transition-colors duration-200 text-sm hidden">
                导入信息
              </button>
              <button id="exportUserInfoBtn"
                class="px-3 py-1 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded-lg transition-colors duration-200 text-sm hidden dark:bg-gray-700 dark:text-white dark:hover:bg-gray-600">
                导出信息
              </button>
            </div>
          </div>
          <div class="bg-gray-100 rounded-lg overflow-hidden dark:bg-gray-800 flex-1 flex flex-col">
            <ul id="searchResultList" class="divide-y divide-gray-700 dark:divide-gray-700 flex-1 overflow-y-auto">
              <!-- 搜索结果动态渲染 -->
            </ul>
            <div class="p-4 text-center flex-shrink-0">
              <button id="loadMoreBtn" class="text-primary hover:text-primary/80 transition-colors duration-200 hidden">
                加载更多
              </button>
            </div>
          </div>
        </div>

        <!-- 歌单详情 -->
        <div id="playlistDetailSection" class="flex-1 flex flex-col mb-8 hidden min-h-0">
          <div class="flex items-center justify-between mb-4 flex-shrink-0">
            <h2 class="text-xl font-bold dark:text-white" id="playlistDetailTitle">歌单详情</h2>
            <!-- 新增：本地歌单导入按钮，默认隐藏 -->
            <button id="importLocalBtn"
              class="px-4 py-2 bg-primary hover:bg-primary/90 text-white rounded-lg transition-colors duration-200 hidden">
              导入
            </button>
          </div>

          <!-- 歌单信息区域 -->
          <div class="flex items-center justify-between mb-6 flex-shrink-0" id="playlistInfoArea">
            <div class="flex items-center">
              <div class="mr-4" id="playlistCoverContainer">
                <img id="playlistCoverImg" src="" alt="歌单封面" class="w-20 h-20 rounded-lg shadow-md object-cover"
                  loading="lazy">
              </div>
              <div class="flex-1">
                <div class="flex items-center gap-2">
                  <h3 class="text-lg font-semibold dark:text-white" id="playlistDetailName">歌单名称</h3>
                  <span class="text-sm text-gray-500 dark:text-gray-400" id="playlistSongCount">0首</span>
                </div>
                <p class="text-sm text-gray-500 dark:text-gray-400 mt-1" id="playlistDetailDescription">歌单描述</p>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <button id="exportPlaylistBtn"
                class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded-lg transition-colors duration-200 flex items-center gap-2 dark:bg-gray-700 dark:text-white dark:hover:bg-gray-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
              </button>
              <button id="playPlaylistBtn"
                class="px-4 py-2 bg-primary hover:bg-primary/90 text-white rounded-lg transition-colors duration-200 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
              </button>
            </div>
          </div>

          <div class="bg-gray-100 rounded-lg overflow-hidden dark:bg-gray-800 flex-1 flex flex-col">
            <ul id="playlistDetailList" class="divide-y divide-gray-700 dark:divide-gray-700 flex-1 overflow-y-auto">
              <!-- 歌单歌曲动态渲染 -->
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 歌单编辑模态框 -->
  <div id="playlistEditModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl w-full max-w-md p-6">
      <h2 class="text-xl font-bold mb-4 dark:text-white">创建歌单</h2>
      <form id="playlistEditForm">
        <div class="mb-4">
          <label class="block text-sm font-medium mb-2 dark:text-white">歌单名称</label>
          <input type="text" id="playlistName"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
            placeholder="请输入歌单名称" required>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium mb-2 dark:text-white">歌单介绍</label>
          <textarea id="playlistDescription"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
            placeholder="请输入歌单介绍" rows="3"></textarea>
        </div>
        <div class="mb-6">
          <label class="block text-sm font-medium mb-2 dark:text-white">歌单封面</label>
          <div class="flex items-center gap-4">
            <div id="coverPreview"
              class="w-24 h-24 bg-gray-200 rounded-md flex items-center justify-center dark:bg-gray-700">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-gray-400" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
            </div>
            <div>
              <input type="file" id="coverUpload" class="hidden" accept="image/*">
              <label for="coverUpload"
                class="px-4 py-2 bg-gray-300 hover:bg-gray-400 text-gray-800 rounded cursor-pointer transition-colors duration-200 dark:bg-gray-700 dark:text-white dark:hover:bg-gray-600">
                选择封面
              </label>
              <p class="text-xs text-gray-500 mt-1 dark:text-gray-400">支持JPG、PNG格式</p>
            </div>
          </div>
        </div>
        <div class="flex justify-end gap-3">
          <button type="button" id="importPlaylistBtnModal"
            class="px-4 py-2 bg-gray-300 hover:bg-gray-400 text-gray-800 rounded transition-colors duration-200 dark:bg-gray-700 dark:text-white dark:hover:bg-gray-600 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            导入歌单
          </button>
          <button type="button" id="cancelPlaylistBtn"
            class="px-4 py-2 bg-gray-300 hover:bg-gray-400 text-gray-800 rounded transition-colors duration-200 dark:bg-gray-700 dark:text-white dark:hover:bg-gray-600">
            取消
          </button>
          <button type="submit" id="savePlaylistBtn"
            class="px-4 py-2 bg-primary hover:bg-primary/90 text-white rounded transition-colors duration-200">
            创建
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 歌词界面 (合并自 index2.html，优化窄屏显示) -->
  <div id="lyricsInterface" class="fixed inset-0 bg-gray-100 z-45 hidden dark:bg-gray-900">
    <div class="h-full flex items-center justify-center p-4 md:p-8"> <!-- 缩小默认内边距 -->
      <!-- 左侧专辑封面：仅在中等屏幕及以上显示 -->
      <div class="flex-shrink-0 mr-16 ml-8 hidden md:block">
        <img src="" alt="专辑封面" class="w-96 h-96 md:w-48 md:h-48 object-cover rounded-2xl shadow-2xl" id="lyricsCoverImg"
          loading="lazy">
      </div>
      <!-- 右侧歌词：窄屏时占满宽度，中等屏幕以上保持 flex-1 -->
      <div class="w-full md:flex-1 max-w-3xl flex flex-col h-full md:h-full px-4 md:px-0"> <!-- 窄屏加内边距 -->
        <!-- 歌曲信息 -->
        <div class="text-center mb-4 md:mb-6 flex-shrink-0"> <!-- 减小底部边距 -->
          <h2 class="text-xl md:text-2xl font-bold dark:text-white mb-1 md:mb-2 truncate" id="lyricsSongTitle">未播放歌曲
          </h2>
          <p class="text-gray-400 dark:text-gray-500 truncate text-sm md:text-base" id="lyricsSongArtist">--</p>
        </div>
        <!-- 歌词区域 -->
        <div class="flex-1 min-h-[50vh] md:min-h-[70vh] overflow-y-auto lyrics-scroll-container"> <!-- 窄屏时降低最小高度 -->
          <div class="lyrics-area" id="lyricsArea">
            请选择歌曲播放以显示歌词
          </div>
        </div>
      </div>
      <!-- 关闭按钮 -->
      <div class="fixed top-4 right-4">
        <button id="closeLyricsBtn"
          class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-200 hover:bg-gray-300 transition-all duration-200 dark:bg-gray-700 dark:hover:bg-gray-600">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 播放列表浮窗 -->
  <div id="playlistFloat"
    class="fixed w-52 bg-gray-200 border-l border-gray-300 shadow-lg z-60 transform translate-x-full transition-transform duration-300 dark:bg-gray-800 dark:border-gray-700"
    style="top: 60px; bottom: 152px; right: 0; width: 200px;">
    <div class="h-full flex flex-col">
      <!-- 浮窗标题 -->
      <div class="p-4 border-b border-gray-300 flex items-center justify-between dark:border-gray-700">
        <h3 class="font-medium dark:text-white">播放列表</h3>
        <button id="closePlaylistBtn"
          class="text-gray-400 hover:text-gray-600 transition-colors duration-200 dark:text-gray-500 dark:hover:text-gray-300">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <!-- 播放列表内容 -->
      <div class="flex-1 overflow-y-auto pb-24">
        <ul id="playlistList" class="divide-y divide-gray-300 dark:divide-gray-700">
          <!-- 播放列表动态渲染 -->
        </ul>
      </div>
    </div>
  </div>

  <!-- 固定底部的播放器 -->
  <!-- 固定底部的播放器（始终展开，无折叠功能） -->
  <div
    class="fixed bottom-0 left-0 right-0 bg-gray-200 dark:bg-gray-800 border-t border-gray-300 dark:border-gray-700 shadow-lg z-40 pb-0 box-border transition-transform duration-300"
    style="bottom: 20px; min-height: 140px; height: auto;">
    <div class="container mx-auto px-3 py-0 h-full">


      <div class="flex flex-col w-full h-full">
        <!-- 正在播放信息和音频控件 -->
        <div class="flex items-center w-full mb-1">
          <img id="coverImg" class="w-10 h-10 rounded-lg object-cover mr-3 shadow-md" src="">
          <div class="flex-1 min-w-0">
            <div id="songTitle" class="font-semibold text-sm truncate dark:text-white">未播放歌曲</div>
            <div id="songArtist" class="text-xs text-gray-500 dark:text-gray-400 truncate">--</div>
          </div>
          <!-- 音频控件 -->
          <audio id="audioPlayer" controls class="w-3/4" preload="metadata"></audio>
        </div>

        <!-- 播放控制按钮组（一行） -->
        <div class="flex items-center justify-between w-full">
          <button id="prevBtn"
            class="w-10 h-10 rounded-full bg-gray-200 dark:bg-gray-700 flex items-center justify-center hover:bg-gray-300 dark:hover:bg-gray-600 transition-all duration-200 active:scale-95"
            title="上一首">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-700 dark:text-gray-200" fill="currentColor"
              viewBox="0 0 24 24">
              <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
            </svg>
          </button>
          <button id="nextBtn"
            class="w-10 h-10 rounded-full bg-gray-200 dark:bg-gray-700 flex items-center justify-center hover:bg-gray-300 dark:hover:bg-gray-600 transition-all duration-200 active:scale-95"
            title="下一首">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-700 dark:text-gray-200" fill="currentColor"
              viewBox="0 0 24 24">
              <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
            </svg>
          </button>
          <!-- 播放模式按钮 -->
          <div class="play-mode-group flex items-center gap-1">
            <button id="orderBtn" data-mode="order"
              class="w-9 h-9 rounded-full bg-gray-200 dark:bg-gray-700 flex items-center justify-center hover:bg-gray-300 dark:hover:bg-gray-600 transition-all duration-200 active:scale-95"
              title="顺序播放">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-600 dark:text-gray-300" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </button>
            <button id="reverseBtn" data-mode="reverse"
              class="w-9 h-9 rounded-full bg-gray-200 dark:bg-gray-700 flex items-center justify-center hover:bg-gray-300 dark:hover:bg-gray-600 transition-all duration-200 active:scale-95"
              title="倒序播放">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-600 dark:text-gray-300" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M20 6l-2 2m2-2l-2-2m2 2H4" />
              </svg>
            </button>
            <button id="singleLoopBtn" data-mode="singleLoop"
              class="w-9 h-9 rounded-full bg-gray-200 dark:bg-gray-700 flex items-center justify-center hover:bg-gray-300 dark:hover:bg-gray-600 transition-all duration-200 active:scale-95"
              title="单曲循环">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-600 dark:text-gray-300" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </button>
            <button id="listLoopBtn" data-mode="listLoop"
              class="w-9 h-9 rounded-full bg-gray-200 dark:bg-gray-700 flex items-center justify-center hover:bg-gray-300 dark:hover:bg-gray-600 transition-all duration-200 active:scale-95"
              title="列表循环">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-600 dark:text-gray-300" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
              </svg>
            </button>
            <button id="shuffleBtn" data-mode="shuffle"
              class="w-9 h-9 rounded-full bg-gray-200 dark:bg-gray-700 flex items-center justify-center hover:bg-gray-300 dark:hover:bg-gray-600 transition-all duration-200 active:scale-95"
              title="随机播放">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-600 dark:text-gray-300" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
              </svg>
            </button>
          </div>
          <div class="flex items-center gap-1">
            <button id="togglePlaylistBtn"
              class="w-10 h-10 rounded-full bg-gray-200 dark:bg-gray-700 flex items-center justify-center hover:bg-gray-300 dark:hover:bg-gray-600 transition-all duration-200 active:scale-95"
              title="播放列表">

  <script>
      (function () {
        // 获取元素
        const toggleBtn = document.getElementById('theme-toggle');

        // 主题管理对象
        const themeManager = {
          mode: 'light', // 'light' 或 'dark'

          // 应用主题（更新 DOM 和本地存储）
          apply(mode) {
            this.mode = mode;
            // 操作 html 的 dark 类（Tailwind 暗黑模式基于 .dark 类）
            document.documentElement.classList.toggle('dark', mode === 'dark');
            // 更新按钮图标
            const sunIcon = document.getElementById('sunIcon');
            const moonIcon = document.getElementById('moonIcon');
            if (sunIcon && moonIcon) {
              if (mode === 'dark') {
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
              } else {
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
              }
            }
            // 保存到 localStorage
            localStorage.setItem('theme-mode', mode);
          },

          // 切换主题
          toggle() {
            const newMode = this.mode === 'light' ? 'dark' : 'light';
            this.apply(newMode);
          },

          // 初始化主题
          init() {
            // 1. 优先从 localStorage 读取
            const saved = localStorage.getItem('theme-mode');
            if (saved === 'dark' || saved === 'light') {
              this.apply(saved);
              return;
            }

            // 2. 监听系统主题
            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
            const systemMode = mediaQuery.matches ? 'dark' : 'light';
            this.apply(systemMode);

            // 3. 当系统主题变化时，且用户未手动覆盖，则跟随变化
            mediaQuery.addEventListener('change', (e) => {
              if (!localStorage.getItem('theme-mode')) {
                this.apply(e.matches ? 'dark' : 'light');
              }
            });
          }
        };

        // 绑定点击事件
        toggleBtn.addEventListener('click', () => themeManager.toggle());

        // 启动初始化
        themeManager.init();
      })();
  </script>
